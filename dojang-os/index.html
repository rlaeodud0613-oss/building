<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>태권도장 AI 운영 비서</title>
<style>
:root{--bg:#0b1020;--panel:#131a2b;--panel2:#192238;--text:#f5f7fb;--muted:#9aa7bd;--line:#27324b;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#60a5fa}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#090d18,#10182b);color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
h1{font-size:26px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--blue);background:#0d1527}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:rgba(19,26,43,.94);border:1px solid var(--line);border-radius:16px;padding:16px}.metric{font-size:30px;font-weight:800;margin-top:8px}.label{color:var(--muted);font-size:13px}
.command{display:flex;gap:10px;margin-bottom:16px}.command input{flex:1;background:#0d1425;color:#fff;border:1px solid var(--line);padding:15px 16px;border-radius:14px;font-size:16px}.command button,.btn{border:0;border-radius:12px;padding:12px 15px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#111827}.ghost{background:var(--panel2);color:#fff;border:1px solid var(--line)}
.answer{min-height:64px;background:#0d1425;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;line-height:1.6;color:#dbe7f7}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.layout{display:grid;grid-template-columns:1.45fr .8fr;gap:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:600}
.status{display:flex;gap:5px;flex-wrap:wrap}.sbtn{font-size:12px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:#10182a;color:#dbe7f7;cursor:pointer}.sbtn.active.ok{background:#12331e;color:#8ff0ad;border-color:#245a34}.sbtn.active.warn{background:#3b2a0d;color:#ffd47e;border-color:#694814}.sbtn.active.bad{background:#3a1518;color:#ff9a9f;border-color:#69232a}
.side h3{margin-top:0}.msg{white-space:pre-wrap;background:#0d1425;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:180px;color:#dbe7f7;font-size:14px;line-height:1.6}
.small{font-size:12px;color:var(--muted)} input.name{background:#0d1425;color:#fff;border:1px solid var(--line);padding:10px;border-radius:10px;width:100%}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.command{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🥋 태권도장 AI 운영 비서</h1><div class="sub">출석 체크 · 자연어 명령 · 결석자 요약 · 학부모 메시지</div></div>
    <div class="badge" id="today"></div>
  </div>

  <div class="grid">
    <div class="card"><div class="label">전체 수련생</div><div class="metric" id="mTotal">0</div></div>
    <div class="card"><div class="label">출석</div><div class="metric" id="mPresent">0</div></div>
    <div class="card"><div class="label">지각</div><div class="metric" id="mLate">0</div></div>
    <div class="card"><div class="label">결석</div><div class="metric" id="mAbsent">0</div></div>
  </div>

  <div class="command">
    <input id="cmd" placeholder="예: 오늘 출석 확인해봐 / 김민수 출석 처리 / 결석자 보여줘"/>
    <button class="btn primary" onclick="runCommand()">실행</button>
  </div>
  <div class="answer" id="answer">명령을 입력해보세요. 예: <b>“오늘 출석 확인해봐”</b></div>

  <div class="toolbar">
    <button class="btn ghost" onclick="addStudent()">+ 학생 추가</button>
    <button class="btn ghost" onclick="markAll('present')">전체 출석</button>
    <button class="btn ghost" onclick="makeReport()">오늘 리포트</button>
    <button class="btn ghost" onclick="exportData()">데이터 내보내기</button>
    <button class="btn ghost" onclick="resetToday()">오늘 기록 초기화</button>
  </div>

  <div class="layout">
    <div class="card">
      <table>
        <thead><tr><th>수련생</th><th>상태</th><th>메모</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="card side">
      <h3>학부모 메시지 초안</h3>
      <div class="small">결석/지각 상태를 반영해 자동 생성합니다.</div>
      <div class="msg" id="parentMsg" style="margin-top:10px"></div>
      <button class="btn primary" style="margin-top:10px;width:100%" onclick="copyMsg()">메시지 복사</button>
    </div>
  </div>
</div>

<script>
const DATE = new Date().toISOString().slice(0,10);
const STORE = 'dojang-os-v1';
const seed = [
  {id:crypto.randomUUID(),name:'김민수',status:'unset',memo:''},
  {id:crypto.randomUUID(),name:'이서준',status:'unset',memo:''},
  {id:crypto.randomUUID(),name:'박지우',status:'unset',memo:''},
  {id:crypto.randomUUID(),name:'최하윤',status:'unset',memo:''},
  {id:crypto.randomUUID(),name:'정도윤',status:'unset',memo:''}
];
let state = load();

function load(){
  const raw = localStorage.getItem(STORE);
  if(!raw) return {date:DATE,students:seed};
  try{
    const v=JSON.parse(raw);
    if(v.date!==DATE) return {date:DATE,students:(v.students||seed).map(s=>({...s,status:'unset',memo:''}))};
    return v;
  }catch{return {date:DATE,students:seed}}
}
function save(){localStorage.setItem(STORE,JSON.stringify(state));render()}
function labelStatus(s){return s==='present'?'출석':s==='late'?'지각':s==='absent'?'결석':'미체크'}
function setStatus(id,status){const s=state.students.find(x=>x.id===id);if(s){s.status=status;save()}}
function setMemo(id,val){const s=state.students.find(x=>x.id===id);if(s){s.memo=val;localStorage.setItem(STORE,JSON.stringify(state));generateParentMsg()}}
function removeStudent(id){if(confirm('이 학생을 삭제할까요?')){state.students=state.students.filter(x=>x.id!==id);save()}}
function counts(){return {
 total:state.students.length,
 present:state.students.filter(s=>s.status==='present').length,
 late:state.students.filter(s=>s.status==='late').length,
 absent:state.students.filter(s=>s.status==='absent').length,
 unset:state.students.filter(s=>s.status==='unset').length
}}
function render(){
 document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
 const c=counts();
 mTotal.textContent=c.total;mPresent.textContent=c.present;mLate.textContent=c.late;mAbsent.textContent=c.absent;
 tbody.innerHTML=state.students.map(s=>`
 <tr>
   <td><b>${esc(s.name)}</b></td>
   <td><div class="status">
     <button class="sbtn ${s.status==='present'?'active ok':''}" onclick="setStatus('${s.id}','present')">출석</button>
     <button class="sbtn ${s.status==='late'?'active warn':''}" onclick="setStatus('${s.id}','late')">지각</button>
     <button class="sbtn ${s.status==='absent'?'active bad':''}" onclick="setStatus('${s.id}','absent')">결석</button>
   </div></td>
   <td><input class="name" value="${esc(s.memo)}" placeholder="메모" onchange="setMemo('${s.id}',this.value)"></td>
   <td><button class="sbtn" onclick="removeStudent('${s.id}')">삭제</button></td>
 </tr>`).join('');
 generateParentMsg();
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addStudent(){const name=prompt('학생 이름을 입력하세요.');if(name&&name.trim()){state.students.push({id:crypto.randomUUID(),name:name.trim(),status:'unset',memo:''});save()}}
function markAll(status){state.students.forEach(s=>s.status=status);save()}
function resetToday(){if(confirm('오늘 출석 기록을 모두 초기화할까요?')){state.students.forEach(s=>{s.status='unset';s.memo=''});save()}}
function summary(){
 const c=counts(); const abs=state.students.filter(s=>s.status==='absent').map(s=>s.name);
 const late=state.students.filter(s=>s.status==='late').map(s=>s.name);
 const rate=c.total?Math.round((c.present+c.late)/c.total*100):0;
 return `오늘 총 ${c.total}명 중 출석 ${c.present}명, 지각 ${c.late}명, 결석 ${c.absent}명, 미체크 ${c.unset}명입니다. 출석률은 ${rate}%입니다.${abs.length?' 결석: '+abs.join(', ')+'.':''}${late.length?' 지각: '+late.join(', ')+'.':''}`;
}
function makeReport(){answer.textContent=summary()}
function runCommand(){
 const raw=cmd.value.trim(); if(!raw)return;
 const q=raw.replace(/\s+/g,' ');
 if(/오늘.*출석.*(확인|알려|어때|봐)|출석.*현황|오늘.*리포트/.test(q)){answer.textContent=summary();return}
 if(/결석자|누가.*결석|결석.*누구/.test(q)){const a=state.students.filter(s=>s.status==='absent');answer.textContent=a.length?'오늘 결석자는 '+a.map(x=>x.name).join(', ')+'입니다.':'현재 체크된 결석자가 없습니다.';return}
 if(/지각자|누가.*지각|지각.*누구/.test(q)){const a=state.students.filter(s=>s.status==='late');answer.textContent=a.length?'오늘 지각자는 '+a.map(x=>x.name).join(', ')+'입니다.':'현재 체크된 지각자가 없습니다.';return}
 for(const s of state.students){
   if(q.includes(s.name)){
     if(q.includes('출석')){s.status='present';save();answer.textContent=s.name+' 학생을 출석 처리했습니다.';return}
     if(q.includes('지각')){s.status='late';save();answer.textContent=s.name+' 학생을 지각 처리했습니다.';return}
     if(q.includes('결석')){s.status='absent';save();answer.textContent=s.name+' 학생을 결석 처리했습니다.';return}
   }
 }
 if(/전체.*출석|모두.*출석/.test(q)){markAll('present');answer.textContent='전체 학생을 출석 처리했습니다.';return}
 answer.textContent='아직 이 명령은 배우지 못했습니다. 예: “오늘 출석 확인해봐”, “김민수 출석 처리”, “결석자 보여줘”';
}
function generateParentMsg(){
 const abs=state.students.filter(s=>s.status==='absent'), late=state.students.filter(s=>s.status==='late');
 let txt='안녕하세요. 오늘 태권도 수업 출결 안내드립니다.\n\n';
 if(!abs.length&&!late.length) txt+='현재 결석/지각으로 체크된 수련생이 없습니다.';
 if(abs.length) txt+='[결석] '+abs.map(s=>s.name+(s.memo?' ('+s.memo+')':'')).join(', ')+'\n';
 if(late.length) txt+='[지각] '+late.map(s=>s.name+(s.memo?' ('+s.memo+')':'')).join(', ')+'\n';
 txt+='\n확인이 필요한 내용이 있으면 편하게 말씀해주세요.';
 parentMsg.textContent=txt;
}
async function copyMsg(){await navigator.clipboard.writeText(parentMsg.textContent);answer.textContent='학부모 메시지 초안을 복사했습니다.'}
function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dojang-attendance-'+DATE+'.json';a.click();URL.revokeObjectURL(a.href)
}
cmd.addEventListener('keydown',e=>{if(e.key==='Enter')runCommand()});
render();
</script>
</body>
</html>
