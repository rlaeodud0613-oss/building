<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b1020"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="stylesheet" href="./styles.css"/>
<title>태권도장 AI 운영 비서</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🥋</div>
      <div><strong>DOJANG OS</strong><span>태권도장 AI 운영 비서</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-note">
      <div class="dot"></div>
      <div><b>로컬 안전 모드</b><span>현재 개인정보는 이 브라우저에만 저장됩니다.</span></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">운영 대시보드</h1>
        <p id="pageSub">오늘 도장 운영을 한눈에 확인합니다.</p>
      </div>
      <div class="top-actions">
        <button class="ghost" id="quickReportBtn">오늘 리포트</button>
        <button class="primary" id="addStudentBtn">+ 수련생 추가</button>
      </div>
    </header>

    <section class="command-box">
      <div class="command-label">AI 명령</div>
      <div class="command-row">
        <input id="commandInput" placeholder="예: 오늘 출석 확인해봐 / 결석자 보여줘 / 회비 미납자 알려줘"/>
        <button id="runCommandBtn" class="primary">실행</button>
      </div>
      <div class="command-hints">
        <button data-cmd="오늘 출석 확인해봐">오늘 출석</button>
        <button data-cmd="결석자 보여줘">결석자</button>
        <button data-cmd="회비 미납자 알려줘">미납자</button>
        <button data-cmd="오늘 상담 예정 보여줘">상담 예정</button>
      </div>
      <div id="assistantAnswer" class="assistant-answer">명령을 입력하면 현재 저장된 도장 데이터를 기준으로 답합니다.</div>
    </section>

    <section id="view"></section>
  </main>
</div>

<dialog id="studentDialog">
  <form method="dialog" id="studentForm">
    <div class="dialog-head"><h3>수련생 등록</h3><button value="cancel" class="icon-btn">✕</button></div>
    <label>이름<input name="name" required placeholder="예: 김민수"/></label>
    <label>반<select name="group"><option>유치부</option><option selected>초등부</option><option>중고등부</option><option>입시반</option><option>선수부</option><option>성인부</option></select></label>
    <label>월 회비<input name="fee" type="number" min="0" step="1000" value="150000"/></label>
    <label>메모<textarea name="memo" rows="3" placeholder="알레르기, 지도 포인트 등 민감정보는 최소화하세요."></textarea></label>
    <menu><button value="cancel" class="ghost">취소</button><button id="saveStudentBtn" value="default" class="primary">저장</button></menu>
  </form>
</dialog>

<dialog id="reportDialog">
  <div class="dialog-head"><h3>오늘 운영 리포트</h3><button id="closeReportBtn" class="icon-btn">✕</button></div>
  <pre id="reportText"></pre>
  <div class="dialog-actions">
    <button id="copyReportBtn" class="ghost">복사</button>
    <button id="exportBackupBtn" class="primary">백업 다운로드</button>
  </div>
</dialog>

<script src="./app.js"></script>
</body>
</html>
